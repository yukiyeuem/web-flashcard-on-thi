name = "web-flashcard-on-thi"
main = "worker.ts"
compatibility_date = "2024-04-01"

# Cấu hình thư mục chứa mã nguồn tĩnh sau khi build cho Cloudflare
[assets]
directory = "./dist"
binding = "ASSETS"

# Binding Cloudflare D1 Database cho tài khoản quản trị
[[d1_databases]]
binding = "DB"
database_name = "cer-oracle"
database_id = "d6f19ac4-a858-4fff-83d0-87eacbddf1c7"

# Biến môi trường
[vars]
ADMIN_EMAIL = "huyhoangpham387@gmail.com"
RESEND_FROM_EMAIL = "CertFlash <onboarding@resend.dev>"
